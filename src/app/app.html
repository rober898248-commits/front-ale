<div class="stage">
  <div class="sparkles" aria-hidden="true">
    @for (spark of sparkles; track spark.left + spark.delay) {
      <span
        class="sparkle"
        [style.left]="spark.left + '%'"
        [style.font-size]="spark.size + 'rem'"
        [style.opacity]="spark.opacity"
        [style.animation-delay]="spark.delay + 's'"
        [style.animation-duration]="spark.duration + 's'"
        >♥</span
      >
    }
  </div>

  <div class="heart" role="img" aria-label="Te amo">
    <svg class="heart__shape" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff85b3" />
          <stop offset="45%" stop-color="#f72585" />
          <stop offset="100%" stop-color="#b5179e" />
        </linearGradient>
      </defs>
      <path
        d="M50 89.5C50 89.5 4 61.5 4 33.5C4 16 15.7 5 29.5 5C38.2 5 45.6 10.2 50 17.8C54.4 10.2 61.8 5 70.5 5C84.3 5 96 16 96 33.5C96 61.5 50 89.5 50 89.5Z"
        fill="url(#heartFill)"
      />
    </svg>

    <span class="heart__text">te amo</span>
  </div>
</div>
